name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,live,figures]'
      - name: Test
        run: python -m pytest
      - name: Validate release evidence
        run: python scripts/verify_release.py
      - name: Validate paper and Pages
        run: |
          python paper/scripts/validate_artifacts.py
          python scripts/build_pages.py --output _site
      - name: Build package
        run: python -m build
