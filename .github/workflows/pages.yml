name: Deploy documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_status: ${{ steps.pages.outcome }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the site build's only third-party dependency
        # The benchmark explorer reads upstream provenance out of the sealed YAML source
        # manifest, so the docs build needs pyyaml. Installing just this one keeps the
        # docs job fast instead of pulling the project's numeric stack.
        run: python -m pip install pyyaml
      - name: Configure Pages when the repository plan permits it
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build and validate site
        run: python scripts/build_pages.py --output _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: needs.build.outputs.pages_status == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
