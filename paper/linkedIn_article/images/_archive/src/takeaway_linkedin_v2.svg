<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
  <title id="title">What guarded agentic compaction changes and what it refuses</title>
  <desc id="desc">A three-card editorial summary describing what the method keeps, what it changes, and what it refuses to promise, with a closing statement that traces establish recurrence rather than admissibility.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbfcfe"/>
      <stop offset="100%" stop-color="#f3f7fd"/>
    </linearGradient>
    <linearGradient id="quoteBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#152947"/>
      <stop offset="100%" stop-color="#1d3b64"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#25364f" flood-opacity="0.13"/>
    </filter>
    <style>
      .sans { font-family: "Avenir Next", "Segoe UI", Arial, sans-serif; }
      .title { font-size: 60px; font-weight: 760; letter-spacing: -0.04em; }
      .subtitle { font-size: 26px; font-weight: 500; }
      .cardTag { font-size: 22px; font-weight: 760; letter-spacing: 0.10em; text-transform: uppercase; }
      .cardTitle { font-size: 48px; font-weight: 760; letter-spacing: -0.03em; }
      .cardBody { font-size: 30px; font-weight: 500; }
      .quoteLine { font-size: 48px; font-weight: 760; letter-spacing: -0.03em; }
      .quoteSub { font-size: 28px; font-weight: 500; }
    </style>
  </defs>

  <rect width="1800" height="1080" fill="url(#bg)"/>

  <g class="sans">
    <text x="90" y="104" class="title" fill="#17233e">What GAC changes, and what it refuses to promise</text>
    <text x="90" y="146" class="subtitle" fill="#5d6f8a">The compiler is conservative by design; every claimed speedup is conditional on evidence.</text>

    <g filter="url(#cardShadow)">
      <rect x="90" y="230" width="500" height="470" rx="36" fill="#edf9f5" stroke="#1db987" stroke-width="2.5"/>
      <circle cx="160" cy="308" r="18" fill="#1db987"/>
      <text x="194" y="316" class="cardTag" fill="#1c8564">What stays</text>
      <text x="126" y="404" class="cardTitle" fill="#17233e">Keeps</text>
      <text x="126" y="470" class="cardBody" fill="#40526d">
        <tspan x="126" dy="0">The model still handles steps</tspan>
        <tspan x="126" dy="40">that need judgment, adaptation,</tspan>
        <tspan x="126" dy="40">or fresh reasoning.</tspan>
      </text>
    </g>

    <g filter="url(#cardShadow)">
      <rect x="650" y="230" width="500" height="470" rx="36" fill="#eef4ff" stroke="#3d7fff" stroke-width="2.5"/>
      <circle cx="720" cy="308" r="18" fill="#3d7fff"/>
      <text x="754" y="316" class="cardTag" fill="#3269d2">What shifts</text>
      <text x="686" y="404" class="cardTitle" fill="#17233e">Changes</text>
      <text x="686" y="470" class="cardBody" fill="#40526d">
        <tspan x="686" dy="0">Deterministic code replaces</tspan>
        <tspan x="686" dy="40">repeated read-only prefixes only</tspan>
        <tspan x="686" dy="40">when the evidence is strong.</tspan>
      </text>
    </g>

    <g filter="url(#cardShadow)">
      <rect x="1210" y="230" width="500" height="470" rx="36" fill="#fff5e9" stroke="#ef9800" stroke-width="2.5"/>
      <circle cx="1280" cy="308" r="18" fill="#ef9800"/>
      <text x="1314" y="316" class="cardTag" fill="#bf7200">What stops</text>
      <text x="1246" y="404" class="cardTitle" fill="#17233e">Refuses</text>
      <text x="1246" y="470" class="cardBody" fill="#40526d">
        <tspan x="1246" dy="0">Unsafe effects, missing provenance,</tspan>
        <tspan x="1246" dy="40">manifest drift, and families with</tspan>
        <tspan x="1246" dy="40">too little support do not ship.</tspan>
      </text>
    </g>

    <g filter="url(#cardShadow)">
      <rect x="90" y="790" width="1620" height="170" rx="36" fill="url(#quoteBg)"/>
      <text x="130" y="862" class="quoteLine" fill="#f8fbff">Traces establish recurrence, not admissibility.</text>
      <text x="130" y="910" class="quoteSub" fill="#c6d6f0">That is why the method optimizes only the part of the workflow that evidence can license.</text>
    </g>
  </g>
</svg>
