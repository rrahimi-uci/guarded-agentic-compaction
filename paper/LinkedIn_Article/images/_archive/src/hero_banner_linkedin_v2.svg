<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Guarded agentic compaction LinkedIn cover</title>
  <desc id="desc">A light editorial cover image with a strong headline, a short explanation of guarded agentic compaction, and an abstract workflow illustration showing repeated traces becoming a verified compiled program while the baseline remains available.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fcfbf7"/>
      <stop offset="62%" stop-color="#f6f7fb"/>
      <stop offset="100%" stop-color="#eef4ff"/>
    </linearGradient>
    <radialGradient id="haloBlue" cx="84%" cy="26%" r="36%">
      <stop offset="0%" stop-color="#cfe2ff" stop-opacity="0.92"/>
      <stop offset="68%" stop-color="#dbe9ff" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#dbe9ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloWarm" cx="10%" cy="90%" r="28%">
      <stop offset="0%" stop-color="#ffe3d2" stop-opacity="0.78"/>
      <stop offset="70%" stop-color="#ffe3d2" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ffe3d2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fbfdff"/>
    </linearGradient>
    <linearGradient id="accentStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57b8ff"/>
      <stop offset="55%" stop-color="#4868ff"/>
      <stop offset="100%" stop-color="#23b6a6"/>
    </linearGradient>
    <linearGradient id="footerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fbff"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#2d4365" flood-opacity="0.14"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#334c73" flood-opacity="0.12"/>
    </filter>
    <style>
      .sans { font-family: "Avenir Next", "Segoe UI", Arial, sans-serif; }
      .eyebrow { font-size: 24px; font-weight: 760; letter-spacing: 0.14em; text-transform: uppercase; }
      .hero { font-size: 96px; font-weight: 780; letter-spacing: -0.055em; }
      .heroAccent { font-size: 96px; font-weight: 780; letter-spacing: -0.055em; }
      .sub { font-size: 34px; font-weight: 520; letter-spacing: -0.015em; }
      .pill { font-size: 23px; font-weight: 760; letter-spacing: 0.02em; }
      .miniLabel { font-size: 17px; font-weight: 760; letter-spacing: 0.10em; text-transform: uppercase; }
      .miniTitle { font-size: 31px; font-weight: 760; letter-spacing: -0.03em; }
      .miniBody { font-size: 21px; font-weight: 520; }
      .metricValue { font-size: 42px; font-weight: 780; letter-spacing: -0.04em; }
      .metricLabel { font-size: 22px; font-weight: 600; }
      .note { font-size: 24px; font-weight: 520; }
      .caption { font-size: 22px; font-weight: 560; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#haloBlue)"/>
  <rect width="1920" height="1080" fill="url(#haloWarm)"/>

  <g opacity="0.3" fill="none" stroke="#d8e4f4" stroke-width="2">
    <path d="M1035 114 H1830"/>
    <path d="M1035 138 H1830"/>
  </g>
  <g opacity="0.48" fill="#d7e3f6">
    <circle cx="1670" cy="138" r="4"/>
    <circle cx="1710" cy="138" r="4"/>
    <circle cx="1750" cy="138" r="4"/>
    <circle cx="1790" cy="138" r="4"/>
    <circle cx="1670" cy="178" r="4"/>
    <circle cx="1710" cy="178" r="4"/>
    <circle cx="1750" cy="178" r="4"/>
    <circle cx="1790" cy="178" r="4"/>
    <circle cx="1670" cy="218" r="4"/>
    <circle cx="1710" cy="218" r="4"/>
    <circle cx="1750" cy="218" r="4"/>
    <circle cx="1790" cy="218" r="4"/>
  </g>

  <g class="sans">
    <g transform="translate(98 92)">
      <rect x="0" y="0" width="274" height="58" rx="22" fill="#ffffff" stroke="#c7d9ef" stroke-width="1.8"/>
      <text x="28" y="38" class="eyebrow" fill="#2f6db6">Based on the paper</text>

      <text x="0" y="182" class="hero" fill="#17233e">
        <tspan x="0" dy="0">Compile the safe part.</tspan>
      </text>
      <text x="0" y="286" class="heroAccent" fill="#2d7bd6">
        <tspan x="0" dy="0">Retire the rest.</tspan>
      </text>

      <text x="0" y="414" class="sub" fill="#516783">
        <tspan x="0" dy="0">Guarded agentic compaction turns repeated read-only</tspan>
        <tspan x="0" dy="48">agent work into verified programs, while keeping the</tspan>
        <tspan x="0" dy="48">baseline whenever the evidence is weak.</tspan>
      </text>

      <g transform="translate(0 572)">
        <rect x="0" y="0" width="246" height="58" rx="22" fill="#f1f8ff" stroke="#9bc8f5" stroke-width="1.5"/>
        <text x="28" y="38" class="pill" fill="#2d78cf">Evidence-gated</text>
        <rect x="268" y="0" width="300" height="58" rx="22" fill="#f3fbf9" stroke="#8dd6cb" stroke-width="1.5"/>
        <text x="296" y="38" class="pill" fill="#1d8a7d">Baseline-preserving</text>
      </g>

      <text x="0" y="864" class="caption" fill="#6d7f98">Paper: Compiling Recurrent Agent Workflows into Guarded Programs</text>
    </g>

    <g transform="translate(1102 162) scale(0.88)">
      <path d="M176 186 C320 116, 500 118, 636 186" fill="none" stroke="url(#accentStroke)" stroke-width="9" stroke-linecap="round" opacity="0.78"/>
      <path d="M188 286 C330 366, 492 366, 630 286" fill="none" stroke="#c7d8f4" stroke-width="9" stroke-linecap="round" opacity="0.92"/>
      <path d="M216 236 C338 236, 454 236, 548 236" fill="none" stroke="#b8cdef" stroke-width="6" stroke-linecap="round"/>

      <g transform="translate(8 74) rotate(-7 132 96)" filter="url(#softShadow)">
        <rect x="0" y="0" width="264" height="190" rx="28" fill="url(#cardGrad)" stroke="#d9e6f7" stroke-width="2"/>
        <rect x="24" y="22" width="104" height="34" rx="14" fill="#eef6ff"/>
        <text x="42" y="45" class="miniLabel" fill="#377ed2">Trace A</text>
        <text x="24" y="96" class="miniTitle" fill="#17233e">Repeated read</text>
        <text x="24" y="128" class="miniBody" fill="#566b87">fetch record</text>
        <text x="24" y="158" class="miniBody" fill="#566b87">inspect label</text>
      </g>

      <g transform="translate(58 176) rotate(-2 132 96)" filter="url(#softShadow)">
        <rect x="0" y="0" width="264" height="190" rx="28" fill="url(#cardGrad)" stroke="#d9e6f7" stroke-width="2"/>
        <rect x="24" y="22" width="104" height="34" rx="14" fill="#effbf8"/>
        <text x="42" y="45" class="miniLabel" fill="#198c7f">Trace B</text>
        <text x="24" y="96" class="miniTitle" fill="#17233e">Same evidence</text>
        <text x="24" y="128" class="miniBody" fill="#566b87">read comments</text>
        <text x="24" y="158" class="miniBody" fill="#566b87">classify item</text>
      </g>

      <g transform="translate(112 282) rotate(4 132 96)" filter="url(#softShadow)">
        <rect x="0" y="0" width="264" height="190" rx="28" fill="url(#cardGrad)" stroke="#d9e6f7" stroke-width="2"/>
        <rect x="24" y="22" width="104" height="34" rx="14" fill="#fff5eb"/>
        <text x="42" y="45" class="miniLabel" fill="#d58418">Trace C</text>
        <text x="24" y="96" class="miniTitle" fill="#17233e">Observed again</text>
        <text x="24" y="128" class="miniBody" fill="#566b87">same inputs</text>
        <text x="24" y="158" class="miniBody" fill="#566b87">same prefix</text>
      </g>

      <g transform="translate(458 162)" filter="url(#smallShadow)">
        <circle cx="82" cy="82" r="82" fill="#ffffff" stroke="#d3e0f4" stroke-width="2"/>
        <circle cx="82" cy="82" r="56" fill="#f2f7ff" stroke="#8fb4ea" stroke-width="3"/>
        <path d="M58 82 L76 100 L108 64" fill="none" stroke="#2c77cf" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="54" y="146" class="miniLabel" fill="#2c77cf">Gate</text>
      </g>

      <g transform="translate(628 108)" filter="url(#softShadow)">
        <rect x="0" y="0" width="268" height="314" rx="32" fill="#ffffff" stroke="#d3e0f4" stroke-width="2.2"/>
        <rect x="26" y="24" width="142" height="38" rx="14" fill="#eef6ff"/>
        <text x="44" y="49" class="miniLabel" fill="#2d78cf">Program</text>
        <text x="26" y="118" class="miniTitle" fill="#17233e">Compiled prefix</text>
        <g fill="none" stroke="#29a695" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M28 168 L42 182 L68 154"/>
          <path d="M28 214 L42 228 L68 200"/>
          <path d="M28 260 L42 274 L68 246"/>
        </g>
        <text x="86" y="176" class="miniBody" fill="#516783">deterministic</text>
        <text x="86" y="222" class="miniBody" fill="#516783">verified</text>
        <text x="86" y="268" class="miniBody" fill="#516783">fallback ready</text>
      </g>

      <g transform="translate(560 456)" filter="url(#smallShadow)">
        <rect x="0" y="0" width="290" height="72" rx="24" fill="#fffaf4" stroke="#efd5ba" stroke-width="1.8"/>
        <text x="26" y="30" class="miniLabel" fill="#c26f1b">Otherwise</text>
        <text x="26" y="54" class="note" fill="#5a6d86">keep the baseline agent</text>
      </g>
    </g>

    <g transform="translate(98 900)">
      <g filter="url(#smallShadow)">
        <rect x="0" y="0" width="1724" height="116" rx="30" fill="url(#footerGrad)" stroke="#d9e5f5" stroke-width="1.8"/>
      </g>
      <g transform="translate(42 22)">
        <text x="0" y="40" class="metricValue" fill="#2d78cf">50-75%</text>
        <text x="0" y="72" class="metricLabel" fill="#516783">fewer provider requests</text>
      </g>
      <g transform="translate(564 22)">
        <text x="0" y="40" class="metricValue" fill="#1da697">39.5-81.4%</text>
        <text x="0" y="72" class="metricLabel" fill="#516783">fewer tokens</text>
      </g>
      <g transform="translate(1158 22)">
        <text x="0" y="40" class="metricValue" fill="#5460df">51.7-73.0%</text>
        <text x="0" y="72" class="metricLabel" fill="#516783">lower latency</text>
      </g>
    </g>
  </g>
</svg>
