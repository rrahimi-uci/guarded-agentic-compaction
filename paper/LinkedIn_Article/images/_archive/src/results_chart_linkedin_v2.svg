<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Live GitHub workflow study results</title>
  <desc id="desc">A card-based summary of request, token, latency, and estimated cost reductions, plus exact outcome counts for compiled, unchanged, and hand-written workflows.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9fbfe"/>
      <stop offset="100%" stop-color="#eef4fb"/>
    </linearGradient>
    <linearGradient id="footer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10233f"/>
      <stop offset="100%" stop-color="#17355c"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#23364e" flood-opacity="0.14"/>
    </filter>
    <style>
      .sans { font-family: "Avenir Next", "Segoe UI", Arial, sans-serif; }
      .eyebrow { font-size: 20px; font-weight: 760; letter-spacing: 0.13em; text-transform: uppercase; }
      .title { font-size: 58px; font-weight: 760; letter-spacing: -0.04em; }
      .subtitle { font-size: 26px; font-weight: 500; }
      .metric { font-size: 74px; font-weight: 760; letter-spacing: -0.04em; }
      .label { font-size: 30px; font-weight: 700; }
      .detail { font-size: 22px; font-weight: 500; }
      .footerHead { font-size: 24px; font-weight: 760; letter-spacing: 0.10em; text-transform: uppercase; }
      .footerLine { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; }
      .footerSub { font-size: 26px; font-weight: 500; }
    </style>
  </defs>

  <rect width="1600" height="1040" fill="url(#bg)"/>

  <g class="sans">
    <text x="80" y="88" class="eyebrow" fill="#2171c2">Live study</text>
    <text x="80" y="154" class="title" fill="#17233e">Efficiency gains in the GitHub workflow study</text>
    <text x="80" y="196" class="subtitle" fill="#5c6e89">Relative to the unchanged agent across three workflow families.</text>

    <g filter="url(#cardShadow)">
      <rect x="80" y="260" width="680" height="230" rx="34" fill="#ffffff" stroke="#d1dceb" stroke-width="2.2"/>
      <text x="126" y="360" class="metric" fill="#1274cb">50.0-75.0%</text>
      <text x="126" y="410" class="label" fill="#17233e">fewer provider requests</text>
      <text x="126" y="444" class="detail" fill="#50617b">
        <tspan x="126" dy="0">Repeated read-only prefixes stop paying</tspan>
        <tspan x="126" dy="30">for a model on every turn.</tspan>
      </text>
    </g>

    <g filter="url(#cardShadow)">
      <rect x="840" y="260" width="680" height="230" rx="34" fill="#ffffff" stroke="#d1dceb" stroke-width="2.2"/>
      <text x="886" y="360" class="metric" fill="#0e9f91">39.5-81.4%</text>
      <text x="886" y="410" class="label" fill="#17233e">fewer tokens</text>
      <text x="886" y="444" class="detail" fill="#50617b">
        <tspan x="886" dy="0">The savings grow when the same evidence-</tspan>
        <tspan x="886" dy="30">gathering path recurs cleanly.</tspan>
      </text>
    </g>

    <g filter="url(#cardShadow)">
      <rect x="80" y="540" width="680" height="230" rx="34" fill="#ffffff" stroke="#d1dceb" stroke-width="2.2"/>
      <text x="126" y="640" class="metric" fill="#5f63e4">51.7-73.0%</text>
      <text x="126" y="690" class="label" fill="#17233e">lower latency</text>
      <text x="126" y="724" class="detail" fill="#50617b">
        <tspan x="126" dy="0">The system removes redundant reasoning</tspan>
        <tspan x="126" dy="30">loops, not the evidence itself.</tspan>
      </text>
    </g>

    <g filter="url(#cardShadow)">
      <rect x="840" y="540" width="680" height="230" rx="34" fill="#ffffff" stroke="#d1dceb" stroke-width="2.2"/>
      <text x="886" y="640" class="metric" fill="#d0830f">32.0-75.3%</text>
      <text x="886" y="690" class="label" fill="#17233e">lower estimated cost</text>
      <text x="886" y="724" class="detail" fill="#50617b">
        <tspan x="886" dy="0">The paper still keeps refusal cases where</tspan>
        <tspan x="886" dy="30">admission evidence is insufficient.</tspan>
      </text>
    </g>

    <g filter="url(#cardShadow)">
      <rect x="80" y="840" width="1440" height="140" rx="34" fill="url(#footer)"/>
      <text x="126" y="892" class="footerHead" fill="#8ec0ff">Exact outcomes</text>
      <text x="126" y="936" class="footerLine" fill="#ffffff">Compiled 90/90 | Unchanged 89/90 | Hand-written 90/90</text>
      <text x="126" y="968" class="footerSub" fill="#c4d5f1">The contribution is automated discovery and guarded admission, not universal superiority.</text>
    </g>
  </g>
</svg>
