schema: agent-compaction-multidomain-study/v1
# Versioned single-domain study. The original three-domain manifest
# (multidomain-study.yaml, study multidomain-real-records-2026-08) cannot be
# frozen while the SEC pool is unavailable; this manifest freezes HMDA alone
# with the same roles, statistical contract and actions. It is a different
# study and is reported as such, never as execution of the original.
study_id: hmda-real-records-2026-10
scope_note: >-
  Single-domain version of multidomain-real-records-2026-08. The SEC pool is unavailable
  (real normalized pool missing), so the three-domain study cannot be frozen; HMDA is frozen
  alone with identical roles, actions and statistical contract. Vulnerability is omitted
  because its 11% variable-path fraction makes compaction trivial. This is a different study
  from the 2026-08 proposal and is reported as such.
status: proposed_unrun
provider_calls_executed: 0
seed: 20260804
minimum_pool_groups: 420
reserve_groups: 75
roles:
  discovery: 40
  development: 30
  artifact_calibration: 100
  portfolio_calibration: 75
  test: 100
actions: [baseline, grc, macro]
statistical_contract:
  quality_noninferiority_margin: 0.05
  per_domain_confidence: 0.99
  portfolio_overall_confidence: 0.99
  portfolio_quality_risk_limit: 0.10
  portfolio_regret_risk_limit: 0.10
  artifact_quality_risk_limit: 0.10
  bootstrap_resamples: 10000
  secondary_correction: holm
  repeat_groups: 20
  repeats_per_group: 3
  endpoints:
    - model_requests
    - input_tokens
    - cached_input_tokens
    - output_tokens
    - total_tokens
    - estimated_cost_usd
    - wall_latency_ms
    - critical_path_ms
    - tool_calls
domains:
  hmda:
    group_identity: [lei]
    source_manifest: manifests/sources/hmda.yaml
    effect_catalog: contracts/effects/hmda.yaml
    output_schema: contracts/hmda_record.schema.json
